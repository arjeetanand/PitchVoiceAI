services:
  - type: web
    name: pitchvoice-ai
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash render-start.sh
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://pitchvoice-ai.onrender.com
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: browser
      - key: PITCH_DOCUMENT_PATH
        value: ./data/pitch.txt
      - key: HUGGINGFACE_TTS_MODE
        value: off
